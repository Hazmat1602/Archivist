[package]
name = "archivist"
version = "1.0.0"
description = "Archivist records management desktop client"
edition = "2021"

[lib]
name = "archivist_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
